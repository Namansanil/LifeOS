version: '3.8'

services:
  opentopodata:
    image: opentopodata/opentopodata:latest
    container_name: lifeos-opentopodata
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - WORKERS=2
      - TIMEOUT=30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
